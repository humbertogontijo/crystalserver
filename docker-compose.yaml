# Coolify compose pack — idleot/crystalserver
#
# The image is built by GitHub Actions (.github/workflows/build-image.yml) and
# pushed to GHCR; Coolify only pulls it. idleot/release sets IMAGE_TAG=<sha>
# on each release (rollback = redeploy an older tag).
# Local source build: docker build -t ghcr.io/idleot/crystalserver:latest .

services:
  crystalserver:
    image: ghcr.io/idleot/crystalserver:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "7171:7171"
      - "7172:7172"
      - "7173:7173"
      - "7174:7174"
    # Datapack ships in the image. Mount only mutable runtime state if needed
    # (logs/cache). Do not bind-mount host data-global over the image pack.
    volumes:
      - type: bind
        source: /data/idleot/crystalserver/cache
        target: /crystalserver/cache
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-crystal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crystalserver}
      SERVER_IP: ${SERVER_IP:-auto}
      STATUS_PORT: ${STATUS_PORT:-7171}
      GAME_PORT: ${GAME_PORT:-7172}
      WEBSOCKET_GAME_PORT: ${WEBSOCKET_GAME_PORT:-7174}
      WORLD_STATUS_PORT: ${WORLD_STATUS_PORT:-7173}
      STATUS_ADVERTISE_IP: ${STATUS_ADVERTISE_IP:-}
      SERVER_NAME: ${SERVER_NAME:-Idlebra}
      SERVER_MOTD: ${SERVER_MOTD:-}
      OWNER_NAME: ${OWNER_NAME:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      SERVER_URL: ${SERVER_URL:-}
      COIN_IMAGES_URL: ${COIN_IMAGES_URL:-}
      IDLEOT_ASSET_BASE: ${IDLEOT_ASSET_BASE:-}
      # Prometheus exporter on :9464 — internal only (scraped as crystalserver:9464
      # over the coolify network by deploy/metrics); never publish it in `ports`.
      METRICS_ENABLE_PROMETHEUS: ${METRICS_ENABLE_PROMETHEUS:-true}
      METRICS_PROMETHEUS_ADDRESS: ${METRICS_PROMETHEUS_ADDRESS:-0.0.0.0:9464}
