---
# Single entry point so a push produces one workflow run (and at most one
# failure notification). Upstream build/lint/test workflows are kept as
# `workflow_call` targets.
name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Private repo billing (macOS 10x, Windows 2x): pushes to main run the lint
# checks only. Ubuntu builds on PRs; the other platforms and the stock Docker
# build only on manual dispatch. Release images are built by build-image.yml,
# dispatched from idleot/release.

jobs:
  changes:
    name: Detect Scope
    runs-on: ubuntu-latest
    outputs:
      build: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.build }}
      lua: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.lua }}
      schema: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.schema }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            build:
              - "src/**"
              - "cmake/**"
              - "docker/**"
              - "vcproj/**"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - "vcpkg.json"
              - ".github/workflows/ci.yml"
              - ".github/workflows/build-*.yml"
              - ".github/workflows/clang-lint.yml"
            lua:
              - "data*/**"
              - ".github/workflows/ci.yml"
              - ".github/workflows/lua-format.yml"
            schema:
              - "schema.sql"
              - ".github/workflows/ci.yml"
              - ".github/workflows/mysql-schema-check.yml"

  tests-lua:
    name: Tests - Lua
    needs: [changes]
    if: needs.changes.outputs.lua == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    uses: ./.github/workflows/tests-lua.yml
    secrets: inherit

  lua-format:
    name: Lua-format
    needs: [changes]
    if: needs.changes.outputs.lua == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    uses: ./.github/workflows/lua-format.yml
    secrets: inherit

  clang-format:
    name: Clang-format
    needs: [changes]
    if: needs.changes.outputs.build == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    uses: ./.github/workflows/clang-lint.yml
    secrets: inherit

  mysql-schema:
    name: MySQL Schema Check
    needs: [changes]
    if: needs.changes.outputs.schema == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    uses: ./.github/workflows/mysql-schema-check.yml
    secrets: inherit

  build-ubuntu:
    name: Build - Ubuntu
    needs: [changes]
    if: github.event_name != 'push' && needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/build-ubuntu.yml
    secrets: inherit

  build-macos:
    name: Build - macOS
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  build-windows-cmake:
    name: Build - Windows - CMake
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/build-windows-cmake.yml
    secrets: inherit

  build-windows-solution:
    name: Build - Windows - Solution
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/build-windows-solution.yml
    secrets: inherit

  build-docker:
    name: Build - Docker
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/build-docker.yml
    secrets: inherit
