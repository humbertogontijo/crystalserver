---
# Build the Coolify runtime image (root Dockerfile) at a pinned commit and push
# ghcr.io/idleot/crystalserver:<sha>. Build-only: idleot/release release.yml
# dispatches this, waits for it, then points Coolify idleot-server at the tag
# and moves :latest once the server is live.
name: Build - Image

run-name: Build image ${{ inputs.ref || github.sha }} ${{ inputs.release_id }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA to build (default: dispatch ref)"
        default: ""
      release_id:
        description: Correlation id (set by idleot/release)
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/crystalserver

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already built
        id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.rev.outputs.sha }}" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"; echo "::notice::$IMAGE:${{ steps.rev.outputs.sha }} already exists"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.built != 'true'
        id: buildx
        uses: docker/setup-buildx-action@v3

      # The Dockerfile keeps vcpkg binaries and ccache in BuildKit cache mounts.
      # Runners are ephemeral, so round-trip those mounts through actions/cache.
      - name: Restore BuildKit cache mounts
        if: steps.exists.outputs.built != 'true'
        id: mounts
        uses: actions/cache@v4
        with:
          path: buildkit-mounts
          key: crystal-mounts-${{ hashFiles('vcpkg.json') }}-${{ steps.rev.outputs.sha }}
          restore-keys: |
            crystal-mounts-${{ hashFiles('vcpkg.json') }}-
            crystal-mounts-

      - name: Inject cache mounts into BuildKit
        if: steps.exists.outputs.built != 'true'
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          skip-extraction: ${{ steps.mounts.outputs.cache-hit }}
          cache-map: |
            {
              "buildkit-mounts/vcpkg-binaries": { "target": "/var/cache/vcpkg-binaries", "id": "idleot-vcpkg-binaries" },
              "buildkit-mounts/vcpkg-downloads": { "target": "/var/cache/vcpkg-downloads", "id": "idleot-vcpkg-downloads" },
              "buildkit-mounts/ccache": { "target": "/var/cache/ccache", "id": "idleot-ccache" }
            }

      - name: Build and push
        if: steps.exists.outputs.built != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ steps.rev.outputs.sha }}
          build-args: |
            CCACHE_MAXSIZE=2G
          cache-from: type=gha,scope=crystalserver
          cache-to: type=gha,scope=crystalserver,mode=max

      - name: Prune old image versions
        if: steps.exists.outputs.built != 'true'
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: crystalserver
          package-type: container
          min-versions-to-keep: 10
