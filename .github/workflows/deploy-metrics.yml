---
# Build the idleot-metrics config images (Prometheus scrape config, Grafana
# provisioning + dashboards) and redeploy the Coolify idleot-metrics app.
name: Deploy metrics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/metrics/**"
      - "metrics/grafana/dashboards/**"
      - ".github/workflows/deploy-metrics.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-metrics
  cancel-in-progress: true

jobs:
  images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: metrics-prometheus
            context: deploy/metrics/prometheus
            file: deploy/metrics/prometheus/Dockerfile
          - name: metrics-grafana
            context: .
            file: deploy/metrics/grafana/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest

  deploy:
    name: Coolify redeploy
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_METRICS_UUID: ${{ vars.COOLIFY_METRICS_UUID }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_METRICS_UUID" ]; then
            echo "::notice::Coolify secrets/vars not set — images pushed, deploy skipped"
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_METRICS_UUID}"
