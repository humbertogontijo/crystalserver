---
# Build the idleot-metrics config images (Prometheus scrape config, Grafana
# provisioning + dashboards), sync deploy/metrics/docker-compose.yaml into the
# Coolify idleot-metrics service and redeploy it.
name: Deploy metrics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/metrics/**"
      - ".github/workflows/deploy-metrics.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-metrics
  cancel-in-progress: true

jobs:
  images:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push metrics-prometheus
        uses: docker/build-push-action@v6
        with:
          context: deploy/metrics/prometheus
          file: deploy/metrics/prometheus/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/metrics-prometheus:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/metrics-prometheus:latest

      - name: Build and push metrics-grafana
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/metrics/grafana/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/metrics-grafana:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/metrics-grafana:latest

      - name: Prune old metrics-prometheus versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: metrics-prometheus
          package-type: container
          min-versions-to-keep: 3

      - name: Prune old metrics-grafana versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: metrics-grafana
          package-type: container
          min-versions-to-keep: 3

      - name: Sync compose and deploy Coolify service
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_METRICS_UUID: ${{ vars.COOLIFY_METRICS_UUID }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_METRICS_UUID" ]; then
            echo "::notice::Coolify secrets/vars not set — images pushed, deploy skipped"
            exit 0
          fi
          api="${COOLIFY_URL%/}/api/v1"
          jq -n --arg compose "$(base64 -w0 deploy/metrics/docker-compose.yaml)" \
            '{docker_compose_raw: $compose}' |
            curl -fsS -o /dev/null -X PATCH \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" -H "Content-Type: application/json" \
              --data @- "${api}/services/${COOLIFY_METRICS_UUID}"
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${api}/deploy?uuid=${COOLIFY_METRICS_UUID}"
          echo "Coolify idleot-metrics service synced and deploy queued"
