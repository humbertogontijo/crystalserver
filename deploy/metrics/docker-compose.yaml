# Coolify service idleot-metrics (Prometheus + Grafana + host/container exporters).
#
# .github/workflows/deploy-metrics.yml builds the images with baked config,
# writes this file into the Coolify service (edits made in the Coolify UI are
# overwritten) and redeploys it; Coolify only pulls. Grafana is the only public
# service: domain https://grafana.idleot.com:3000. Everything else stays internal.
#
# SERVICE_PASSWORD_GRAFANA is generated by Coolify. Keep "Connect to predefined
# network" on so Prometheus reaches Crystal at crystalserver:9464.

services:
  prometheus:
    image: ghcr.io/idleot/metrics-prometheus:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}"
    volumes:
      - prometheus-data:/prometheus
    expose:
      - "9090"

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)"
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
    expose:
      - "9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service,coolify.name"
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"

  grafana:
    image: ghcr.io/idleot/metrics-grafana:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${SERVICE_PASSWORD_GRAFANA}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.idleot.com}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/CrystalServer/crystalserver-performance.json
    volumes:
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"

volumes:
  prometheus-data:
  grafana-data:
