# Overlay metadata for CrystalServer idleot/.
# MOVE collisions are checked against upstream_ref.
upstream: https://github.com/zimbadev/crystalserver.git
upstream_ref: upstream/main
# Product-only Lua lives under idleot/lib|scripts|npc/idleot (runtime overlay).
# Stock datapack tweaks are normal fork commits — list them here so humans
# do not have to sift C++ out of `git diff upstream/main -- data data-global`.
series:
  - id: forked-stock-datapack
    class: product
    role: fork
    summary: Stock Lua/XML edited in the fork (no idleot/*.patch twin).
    paths:
      - data/events/scripts/creature.lua
      - data/events/scripts/party.lua
      - data/events/scripts/player.lua
      - data/modules/scripts/daily_reward/daily_reward.lua
      - data/scripts/actions/objects/market.lua
      - data/scripts/creaturescripts/player/login.lua
      - data/scripts/creaturescripts/player/send_first_items.lua
      - data/scripts/eventcallbacks/monster/ondroploot_prey.lua
      - data/scripts/spells/attack/lesser_ethereal_spear.lua
      - data/scripts/spells/attack/lesser_front_sweep.lua
      - data/scripts/spells/attack/mud_attack.lua
      - data/scripts/spells/support/chivalrous_challenge.lua
      - data/scripts/spells/support/find_fiend.lua
      - data/scripts/spells/support/sharpshooter.lua
      - data/scripts/spells/support/virtue_of_harmony.lua
      - data/scripts/spells/support/virtue_of_justice.lua
      - data/scripts/spells/support/virtue_of_sustain.lua
      - data/scripts/talkactions/gm/push_creature.lua
      - data/scripts/talkactions/gm/teleport_to_creature.lua
      - data/stages.lua
      - data-global/npc/perod.lua
      - data-global/scripts/actions/other/construction_kits.lua
      - data-global/scripts/actions/other/kits.lua
      - data-global/scripts/creaturescripts/others/droploot.lua
      - data-global/scripts/globalevents/others/raids_schedule.lua
      - data-global/scripts/quests/svargrond_arena/creaturescripts_arena_kill.lua
