# IdleOT index for crystalserver — series order + dest→label map for export.
# Overlay Lua/OTUI lives under idleot/ (MOVE/PATCH by extension).
# See idleot/README.md.

path_map:
  src/io/io_wheel.cpp: wheel-balance
  src/game/scheduling/dispatcher.cpp: dispatcher-taskname
  src/server/network/websocket/: websocket
  src/server/network/connection/connection_websocket.cpp: websocket
  src/server/CMakeLists.txt: websocket
  src/server/server.cpp: websocket
  src/server/server.hpp: websocket
  src/server/network/connection/connection.cpp: websocket
  src/server/network/connection/connection.hpp: websocket
  Dockerfile: deploy-coolify
  docker-compose.yaml: deploy-coolify
  CMakeLists.txt: deploy-coolify
  vcpkg.json: deploy-coolify
  .gitignore: deploy-coolify
  .dockerignore: deploy-coolify
  config.lua.dist: deploy-coolify
  src/config/: deploy-coolify
  src/io/functions/: account-bank
  src/io/iologindata.cpp: account-bank
  src/database/databasemanager.cpp: account-bank
  src/map/: instances
  src/items/: instances
  src/creatures/combat/: instances
  src/creatures/creature.cpp: instances
  src/creatures/creature.hpp: instances
  src/creatures/monsters/monsters.cpp: instances
  src/io/iomapserialize.cpp: instances
  src/io/CMakeLists.txt: instances
  src/game/movement/: instances
  tests/unit/io/occupancy_mask_test.cpp: instances
  src/lua/functions/map/: instances
  src/lua/functions/creatures/creature_functions: instances
  src/lua/functions/items/: instances

upstream: zimbadev/crystalserver
base_sha: cbb6da4df0c4477c76d8b8f3c13db990f643f00f
series:
  - id: deploy-coolify
    class: deploy
    feature: deploy-coolify
    summary: Coolify/Docker image, cmake/vcpkg/map-tools + IDLEOT_CUSTOM_DIR, websocketGamePort keys
    paths:
      - .gitignore
      - .dockerignore
      - CMakeLists.txt
      - vcpkg.json
      - Dockerfile
      - docker-compose.yaml
      - config.lua.dist
      - src/config/config_enums.hpp
      - src/config/configmanager.cpp
  - id: websocket
    class: product
    feature: websocket
    summary: Native WebSocket game acceptor + framed connection I/O
    paths:
      - src/server/CMakeLists.txt
      - src/server/server.cpp
      - src/server/server.hpp
      - src/server/network/connection/connection.cpp
      - src/server/network/connection/connection.hpp
      - src/server/network/connection/connection_websocket.cpp
      - src/server/network/websocket/websocket_port.cpp
      - src/server/network/websocket/websocket_port.hpp
  - id: instances
    class: product
    feature: instances
    summary: instanceId visibility/combat/path, ephemeral houses, occupancy test, map hooks
    paths:
      - src/creatures/combat/
      - src/creatures/creature.cpp
      - src/creatures/creature.hpp
      - src/creatures/monsters/monsters.cpp
      - src/items/
      - src/map/
      - src/io/iomapserialize.cpp
      - src/io/CMakeLists.txt
      - src/game/movement/teleport.cpp
      - src/lua/functions/creatures/creature_functions.cpp
      - src/lua/functions/creatures/creature_functions.hpp
      - src/lua/functions/map/
      - src/lua/functions/items/
      - tests/unit/io/occupancy_mask_test.cpp
  - id: gameplay-shared
    class: product
    feature: _shared
    summary: instances+companions+idle+loot/reward+team chat+protocol mega-files
    paths:
      - src/game/game.cpp
      - src/game/game.hpp
      - src/creatures/players/
      - src/creatures/monsters/monster.cpp
      - src/creatures/monsters/monster.hpp
      - src/creatures/interactions/chat.cpp
      - src/creatures/interactions/chat.hpp
      - src/server/network/protocol/
      - src/lua/functions/core/game/
      - src/lua/functions/creatures/player/
      - src/lua/functions/creatures/monster/
  - id: account-bank
    class: product
    feature: account-bank
    summary: Account-scoped bank load/save/offline credit
    paths:
      - src/io/functions/iologindata_load_player.cpp
      - src/io/functions/iologindata_save_player.cpp
      - src/io/iologindata.cpp
      - src/database/databasemanager.cpp
  - id: wheel-balance
    class: upstream-candidate
    role: evolution
    feature: wheel-balance
    summary: IdleOT wheel-of-destiny grade/slot/spell balance
    symbols:
      - IOWheel
      - Intense Wound Cleansing
      - Groundshaker
      - Shield Slam
    paths:
      - src/io/io_wheel.cpp
  - id: dispatcher-taskname
    class: upstream-candidate
    role: fix
    feature: dispatcher-taskname
    summary: Propagate/default dispatcher taskName for walk/async diagnostics
    symbols:
      - taskName
      - Game::walkEvent
      - Dispatcher::asyncEvent
    paths:
      - src/game/scheduling/dispatcher.cpp

